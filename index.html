<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="칸 크기를 mm로 바꾸고 그림과 글자를 넣어 A4 실제 크기 PDF로 받는 미니 CD 케이스 인쇄 도구">
<title>미니 CD 케이스 공방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=Black+Han+Sans&family=Nanum+Myeongjo:wght@700&family=Gaegu:wght@700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: 위 = 전체 배치(칸 고르기), 오른쪽(휴대폰은 아래) = 고른 칸을 크게 띄운 편집 창 + 조작 버튼 */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #16191f;
  --muted: #5d6573;
  --line: #d9dee6;
  --accent: #1f4fd8;
  --accent-ink: #ffffff;
  --accent-soft: #e5ecfd;
  --ok: #157a4a;
  --warn: #b42318;
  --sheet: #ffffff;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
  --radius: 12px;
  --tap: 46px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #1a1d24; --ink: #eceff4; --muted: #9aa3b2; --line: #2c313b;
    --accent: #7c9dff; --accent-ink: #0d1530; --accent-soft: #1e2740; --ok: #5fd39a; --warn: #ff8a7a; --sheet: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #1a1d24; --ink: #eceff4; --muted: #9aa3b2; --line: #2c313b;
  --accent: #7c9dff; --accent-ink: #0d1530; --accent-soft: #1e2740; --ok: #5fd39a; --warn: #ff8a7a; --sheet: #ffffff; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }
header { display: grid; gap: 10px; }
h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 0.85rem; color: var(--muted); }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.steps b { font-family: var(--font-num); color: var(--accent); margin-right: 4px; }
.main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 1rem; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card h2 span { font-family: var(--font-num); font-size: 0.82rem; font-weight: 500; color: var(--muted); }
h3.sub { margin: 4px 0 0; font-size: 0.92rem; }
#preview { width: 100%; height: auto; display: block; background: var(--sheet); border-radius: 8px; box-shadow: 0 0 0 1px var(--line); cursor: pointer; touch-action: manipulation; }
#stage { width: 100%; height: auto; display: block; background: #e9ecf1; border-radius: 10px; touch-action: none; cursor: grab; box-shadow: 0 0 0 1px var(--line); }
#stage.dragging { cursor: grabbing; }
#stage:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 560px) { .tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tabs button {
  font: inherit; font-size: 0.86rem; min-height: var(--tap); border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); border-radius: 10px; cursor: pointer; padding: 4px 4px; display: grid; place-items: center; line-height: 1.2;
}
.tabs button small { font-size: 0.7rem; color: var(--muted); }
.tabs button.done small { color: var(--ok); font-weight: 700; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tabs button[aria-selected="true"] small { color: var(--accent-ink); }
.bigbtn { font: inherit; font-weight: 700; font-size: 1rem; min-height: 52px; width: 100%; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.btn {
  font: inherit; font-size: 0.9rem; min-height: var(--tap); border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); padding: 6px 10px; border-radius: 10px; cursor: pointer; display: inline-grid; place-items: center; line-height: 1.2;
}
.btn .ic { font-family: var(--font-num); font-size: 1.25rem; font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.btn:active, .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.danger { color: var(--warn); }
.btn:disabled, .bigbtn:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 0.84rem; color: var(--muted); margin: 0; }
.warn { font-size: 0.88rem; color: var(--warn); margin: 0; font-weight: 500; }
.gesture { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.84rem; color: var(--muted); margin: 0; padding: 0; list-style: none; }
.gesture li::before { content: "·"; margin-right: 6px; color: var(--accent); font-weight: 700; }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
.box.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.box h3 { margin: 0; font-size: 0.92rem; display: flex; justify-content: space-between; gap: 8px; }
.box h3 span { font-family: var(--font-num); font-weight: 500; color: var(--muted); font-size: 0.8rem; }
.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inline .grow { flex: 1 1 140px; min-width: 0; }
input[type="text"] { font: inherit; font-size: 16px; width: 100%; min-height: var(--tap); padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
input[type="number"] { font-family: var(--font-num); font-size: 16px; width: 100%; min-height: var(--tap); padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums; }
input[type="range"] { flex: 1 1 120px; min-width: 100px; accent-color: var(--accent); height: var(--tap); }
input[type="color"] { width: var(--tap); height: var(--tap); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 3px; cursor: pointer; }
select { font: inherit; font-size: 15px; min-height: var(--tap); padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.num { display: grid; gap: 4px; font-size: 0.82rem; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.export { display: grid; gap: 10px; }
.status { font-size: 0.88rem; min-height: 1.3em; margin: 0; }
.check { display: flex; gap: 10px; align-items: center; font-size: 0.9rem; min-height: var(--tap); cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.dropzone.over #stage { box-shadow: 0 0 0 3px var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>미니 CD 케이스 공방</h1>
    <ol class="steps">
      <li><b>1</b>크기 확인</li><li><b>2</b>칸마다 그림 넣기</li><li><b>3</b>글자 넣기</li><li><b>4</b>손가락으로 맞추기</li><li><b>5</b>A4 PDF 받기</li>
    </ol>
  </header>

  <div class="main">
    <section class="card" aria-label="전체 배치">
      <h2>전체 배치 <span id="sizeSummary"></span></h2>
      <canvas id="preview" width="1400" height="980" aria-label="CD 케이스 전체 배치. 칸을 누르면 그 칸을 편집해요"></canvas>
      <p class="hint">칸을 누르면 편집 창에 크게 떠요. 실선은 자르는 선, 칸 위아래의 짧은 점선은 접는 자리예요.</p>
    </section>

    <section class="card" aria-label="칸 편집">
      <div class="tabs" role="tablist" id="tabs"></div>
      <h2 id="stageTitle"></h2>
      <div class="dropzone" id="dropzone">
        <canvas id="stage" width="800" height="800" tabindex="0" aria-label="고른 칸 편집 창. 끌어서 옮기고 두 손가락으로 확대해요. 키보드 화살표로도 옮길 수 있어요"></canvas>
      </div>
      <div id="controls" class="export"></div>
    </section>

    <section class="card export" aria-label="PDF 받기" style="grid-column: 1 / -1">
      <label class="check"><input type="checkbox" id="labels" checked> 칸 이름, 안내 글자, 50mm 확인용 자도 함께 인쇄</label>
      <button class="bigbtn" id="savePdf">A4 PDF 받기</button>
      <p class="status" id="status" role="status"></p>
      <p class="hint">인쇄할 때 배율을 100%(실제 크기)로 맞춰야 크기가 정확해요. 인쇄한 종이의 자가 50mm인지 재 보세요. 그림은 자르는 선 밖으로 조금 더 그려져서 가위질이 빗나가도 흰 틈이 안 생겨요.</p>
    </section>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>

<script>
(() => {
  const A4 = { w: 210, h: 297 };
  const DEFAULT_SIZE = { cw: 40, ch: 40, bw: 50, fL1: 5, fL2: 5, fR: 5, cdD: 39, hole: 5, bleed: 1 };
  const LIMIT = { cw: [15, 90], ch: [15, 120], bw: [15, 150], fL1: [0, 20], fL2: [0, 20], fR: [0, 20], cdD: [15, 120], hole: [0, 40], bleed: [0, 3] };
  const ZMIN = 1, ZMAX = 4;
  const FONTS = [
    ["IBM Plex Sans KR", "기본 고딕"], ["Black Han Sans", "굵은 제목체"], ["Nanum Myeongjo", "명조"],
    ["Gaegu", "손글씨"], ["Space Grotesk", "영문 고딕"]
  ];
  const PANEL_NAMES = { front: "앞면", inside: "안쪽 면", back: "뒷면", cd: "CD" };
  const STRIP_NAMES = { foldL1: "왼쪽 접힘 ①", foldL2: "왼쪽 접힘 ②", foldR: "오른쪽 접힘" };

  const state = {
    size: { ...DEFAULT_SIZE },
    sel: "front", spineSel: "foldL2", textSel: null, labels: true,
    img: { front: null, inside: null, back: null, cd: null },
    mine: { front: false, inside: false, back: false, cd: false },
    fit: { front: { z: 1, ox: 0, oy: 0 }, inside: { z: 1, ox: 0, oy: 0 }, back: { z: 1, ox: 0, oy: 0 }, cd: { z: 1, ox: 0, oy: 0 } },
    strips: {
      foldL1: { bg: "#1b1f2a", text: "SAMPLE · 예시 앨범", fg: "#ffffff", dir: "down" },
      foldL2: { bg: "#1b1f2a", text: "SAMPLE · 예시 앨범", fg: "#ffffff", dir: "down" },
      foldR:  { bg: "#e9e4da", text: "SAMPLE · 예시 앨범", fg: "#1b1f2a", dir: "down" }
    },
    texts: [], nextId: 1,
    spinesTouched: false, sampleName: ""
  };

  // ---------- 배치 계산(mm) ----------
  let L = null;
  function layout(c) {
    const M = 20, TOP = 25, GAP = 20, SIDE = 18;
    const cover = { x: M, y: TOP, w: c.cw * 2, h: c.ch };
    const backW = c.fL1 + c.fL2 + c.bw + c.fR;
    let back = { x: cover.x + cover.w + SIDE, y: TOP, w: backW, h: c.ch };
    let bottom = TOP + c.ch;
    if (back.x + back.w > A4.w - 10) { back = { x: M, y: bottom + GAP, w: backW, h: c.ch }; bottom = back.y + c.ch; }
    const r = c.cdD / 2;
    const cd = { cx: M + r, cy: bottom + GAP + r, r, hole: c.hole / 2 };
    const b = c.bleed;
    const segs = [];
    let x = back.x;
    if (c.fL1 > 0) { segs.push({ key: "foldL1", x, w: c.fL1 }); x += c.fL1; }
    if (c.fL2 > 0) { segs.push({ key: "foldL2", x, w: c.fL2 }); x += c.fL2; }
    segs.push({ key: "back", x, w: c.bw }); x += c.bw;
    if (c.fR > 0) { segs.push({ key: "foldR", x, w: c.fR }); }
    segs.forEach((s, i) => { s.bleed = [i === 0 ? b : 0, i === segs.length - 1 ? b : 0, b, b]; });
    const panels = {
      inside: { rect: { x: cover.x, y: TOP, w: c.cw, h: c.ch }, bleed: [b, 0, b, b] },
      front: { rect: { x: cover.x + c.cw, y: TOP, w: c.cw, h: c.ch }, bleed: [0, b, b, b] }
    };
    const strips = {};
    for (const s of segs) {
      const rect = { x: s.x, y: back.y, w: s.w, h: back.h };
      if (s.key === "back") panels.back = { rect, bleed: s.bleed }; else strips[s.key] = { rect, bleed: s.bleed };
    }
    const foldsBack = segs.slice(1).map(s => s.x);
    const ruler = { x: back.y === TOP ? back.x : M + c.cdD + 20, y: back.y === TOP ? TOP + c.ch + 30 : cd.cy };
    const right = Math.max(cover.x + cover.w, back.x + back.w, cd.cx + r, ruler.x + 50);
    const lowest = Math.max(cd.cy + r + 8, back.y + back.h + 12, ruler.y + 6);
    const fits = right <= A4.w - 5 && lowest <= 280 && c.hole < c.cdD;
    const view = { x: 10, y: TOP - 11, w: Math.max(right, 150) + 10 - 10, h: lowest - (TOP - 11) + 4 };
    return { cover, back, cd, panels, strips, foldsBack, foldCover: cover.x + c.cw, ruler, view, fits, b };
  }

  // ---------- 예시 그림 ----------
  function sampleArt(w, h, c1, c2, title, sub) {
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const g = cv.getContext("2d");
    const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.globalAlpha = 0.16; g.strokeStyle = "#fff"; g.lineWidth = w * 0.006;
    for (let i = -h; i < w; i += w * 0.06) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + h, h); g.stroke(); }
    g.globalAlpha = 1; g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = `700 ${Math.round(Math.min(w, h) * 0.13)}px "Space Grotesk", sans-serif`;
    g.fillText(title, w / 2, h / 2 - h * 0.05);
    g.font = `500 ${Math.round(Math.min(w, h) * 0.06)}px "IBM Plex Sans KR", sans-serif`;
    g.fillText(sub, w / 2, h / 2 + h * 0.1);
    return cv;
  }
  function loadImg(src) { return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }
  async function loadSamples() {
    const fallback = {
      front: () => sampleArt(900, 900, "#1f4fd8", "#0d1a3f", "SAMPLE", "예시 그림 · 앞면"),
      inside: () => sampleArt(900, 900, "#c2410c", "#3b1206", "INSIDE", "예시 그림 · 안쪽 면"),
      back: () => sampleArt(1125, 900, "#0f766e", "#062b28", "BACK", "예시 그림 · 뒷면"),
      cd: () => sampleArt(900, 900, "#6d28d9", "#1d0b3d", "CD", "예시 그림 · CD")
    };
    const keys = ["front", "inside", "back", "cd"];
    // 리센느 예시 그림은 claude.ai 비공개 페이지에만 같이 올림 (공개 깃허브 페이지에는 없음)
    const got = (window.claude && window.claude.use) ? await Promise.all(keys.map(k => loadImg("sample/" + k + ".jpg"))) : keys.map(() => null);
    keys.forEach((k, i) => { state.img[k] = got[i] || fallback[k](); });
    if (got.every(Boolean)) {
      state.sampleName = "리센느 PULSE 예시";
      Object.assign(state.strips.foldL1, { bg: "#3a3f47", text: "RESCENE · PULSE", fg: "#ffffff" });
      Object.assign(state.strips.foldL2, { bg: "#3a3f47", text: "RESCENE · PULSE", fg: "#ffffff" });
      Object.assign(state.strips.foldR, { bg: "#eef0f3", text: "RESCENE · 4th Mini Album", fg: "#3a3f47" });
    }
  }

  // ---------- 기하 ----------
  const grow = (r, b) => ({ x: r.x - b[0], y: r.y - b[2], w: r.w + b[0] + b[1], h: r.h + b[2] + b[3] });
  function boxOf(k) {
    if (k === "cd") { const rr = L.cd.r + L.b / 2; return { x: L.cd.cx - rr, y: L.cd.cy - rr, w: rr * 2, h: rr * 2 }; }
    return grow(L.panels[k].rect, L.panels[k].bleed);
  }
  function cutOf(k) {
    if (k === "cd") return { x: L.cd.cx - L.cd.r, y: L.cd.cy - L.cd.r, w: L.cd.r * 2, h: L.cd.r * 2 };
    if (k === "spines" || k === "size") return { x: L.back.x, y: L.back.y, w: L.back.w, h: L.back.h };
    return L.panels[k].rect;
  }
  function regionOf(k) {
    if (k === "size") return { x: L.view.x, y: L.view.y, w: L.view.w, h: L.view.h };
    const c = cutOf(k), pad = Math.max(3.5, Math.min(c.w, c.h) * 0.09);
    return { x: c.x - pad, y: c.y - pad, w: c.w + pad * 2, h: c.h + pad * 2 };
  }
  const isPanel = k => k === "front" || k === "inside" || k === "back" || k === "cd";

  // ---------- 그리기 ----------
  const textBoxes = []; // 글자 누르기용 (mm)
  function coverDraw(g, img, box, fit, s) {
    const iw = img.width, ih = img.height, bw = box.w * s, bh = box.h * s;
    const sc = Math.max(bw / iw, bh / ih) * fit.z, dw = iw * sc, dh = ih * sc;
    const x = box.x * s + bw / 2 - dw / 2 + fit.ox * Math.max(0, (dw - bw) / 2);
    const y = box.y * s + bh / 2 - dh / 2 + fit.oy * Math.max(0, (dh - bh) / 2);
    g.save(); g.beginPath(); g.rect(box.x * s, box.y * s, bw, bh); g.clip(); g.drawImage(img, x, y, dw, dh); g.restore();
  }
  function clipPanel(g, k, s) {
    g.beginPath();
    if (k === "cd") { g.arc(L.cd.cx * s, L.cd.cy * s, (L.cd.r + L.b / 2) * s, 0, Math.PI * 2); }
    else { const r = boxOf(k); g.rect(r.x * s, r.y * s, r.w * s, r.h * s); }
    g.clip();
  }
  function fontOf(t, px) { return `${t.bold ? 700 : 400} ${px}px "${t.font}", "IBM Plex Sans KR", sans-serif`; }
  function drawTexts(g, k, s, record) {
    const items = state.texts.filter(t => t.panel === k);
    if (!items.length) return;
    const c = cutOf(k);
    g.save(); clipPanel(g, k, s);
    for (const t of items) {
      const cx = c.x + t.x * c.w, cy = c.y + t.y * c.h, px = t.size * s;
      g.font = fontOf(t, px); g.textAlign = "center"; g.textBaseline = "middle";
      const lines = t.text.split("\n"), lh = t.size * 1.2;
      const wMm = Math.max(...lines.map(l => g.measureText(l).width)) / s;
      lines.forEach((ln, i) => {
        const y = (cy + (i - (lines.length - 1) / 2) * lh) * s;

        el("div", { class: "grid2" }, num("cdD", "지름"), num("hole", "가운데 구멍 지름"))),
      el("div", { class: "box" }, el("h3", {}, "여백", el("span", {}, "자르는 선 밖")),
        el("div", { class: "grid2" }, num("bleed", "그림을 더 그릴 폭"))),
      warnEl,
      el("button", { class: "btn", onclick: () => { state.size = { ...DEFAULT_SIZE }; relayout(); buildControls(); render(); setStatus("크기를 기본값으로 되돌렸어요."); } }, "기본 크기로 되돌리기 (커버 40×40 · 뒷면 5+5+50+5 · CD 39)")
    ];
  }
  function applySize(key, input) {
    const [lo, hi] = LIMIT[key];
    let v = parseFloat(String(input.value).replace(",", "."));
    if (!Number.isFinite(v)) { input.value = state.size[key]; return; }
    v = Math.max(lo, Math.min(hi, Math.round(v * 2) / 2));
    const prev = { ...state.size };
    state.size[key] = v;
    const next = layout(state.size);
    if (key === "hole" && v >= state.size.cdD) { state.size = prev; input.value = prev[key]; setStatus("구멍은 CD 지름보다 작아야 해요."); return; }
    if (!next.fits) {
      state.size = prev; input.value = prev[key];
      const w = document.getElementById("sizeWarn"); if (w) w.textContent = `${v}mm로 하면 A4 한 장에 다 들어가지 않아요. 더 작은 값을 넣어 주세요.`;
      return;
    }
    input.value = v; relayout(); buildControls(); render();
    const f = document.getElementById("sz-" + key); if (f) f.focus();
    setStatus("크기를 바꿨어요.");
  }
  function relayout() { L = layout(state.size); if (!L.strips[state.spineSel]) state.spineSel = Object.keys(L.strips)[0] || "foldL2"; }

  // ----- 접는 부분 -----
  function spineControls() {
    const keys = Object.keys(L.strips);
    const out = [el("p", { class: "hint" }, "케이스에 끼우면 옆에서 보이는 자리예요. 편집 창에서 칸을 눌러 고르고 색과 글자를 넣어요.")];
    if (!keys.length) out.push(el("p", { class: "hint" }, "크기 설정에서 접힘이 모두 0이라 접는 칸이 없어요."));
    for (const k of keys) {
      const v = state.strips[k], wmm = state.size[k === "foldL1" ? "fL1" : k === "foldL2" ? "fL2" : "fR"];
      const sel = () => { if (state.spineSel !== k) { state.spineSel = k; markStrip(); renderStage(); } };
      const touched = () => { state.spinesTouched = true; render(); };
      const dir = el("select", { id: "dir-" + k, "aria-label": STRIP_NAMES[k] + " 글자 방향", onfocus: sel, onchange: e => { v.dir = e.target.value; touched(); } },
        el("option", { value: "down" }, "위→아래"), el("option", { value: "up" }, "아래→위"));
      dir.value = v.dir;
      out.push(el("div", { class: "box" + (state.spineSel === k ? " on" : ""), "data-strip": k, onclick: sel },
        el("h3", {}, STRIP_NAMES[k], el("span", {}, wmm + "mm")),
        el("input", { type: "text", id: "txt-" + k, value: v.text, placeholder: "예: 가수 이름 · 앨범 이름", onfocus: sel, oninput: e => { v.text = e.target.value; touched(); } }),
        el("div", { class: "inline" },
          el("span", { class: "hint" }, "배경"), el("input", { type: "color", id: "bg-" + k, value: v.bg, "aria-label": STRIP_NAMES[k] + " 배경색", onfocus: sel, oninput: e => { v.bg = e.target.value; touched(); } }),
          el("span", { class: "hint" }, "글자"), el("input", { type: "color", id: "fg-" + k, value: v.fg, "aria-label": STRIP_NAMES[k] + " 글자색", onfocus: sel, oninput: e => { v.fg = e.target.value; touched(); } }),
          el("div", { class: "grow" }, dir))));
    }
    out.push(el("div", { class: "row2" },
      el("button", { class: "btn", onclick: () => {
        const src = state.strips[state.spineSel];
        for (const s of Object.values(state.strips)) { s.bg = src.bg; s.fg = src.fg; }
        state.spinesTouched = true; buildControls(); render();
      } }, "고른 칸 색을 모두에"),
      el("button", { class: "btn", onclick: () => { applyFrontColor(); buildControls(); render(); } }, "앞면 그림 색으로")));
    return out;
  }
  function markStrip() { controls.querySelectorAll(".box[data-strip]").forEach(n => n.classList.toggle("on", n.dataset.strip === state.spineSel)); }

  // ---------- 파일 ----------
  function loadFile(k, file) {
    if (!file || !file.type.startsWith("image/")) { setStatus("그림 파일(jpg, png 등)만 넣을 수 있어요."); return; }
    const img = new Image();
    img.onload = () => {
      state.img[k] = img; state.mine[k] = true; Object.assign(state.fit[k], { z: 1, ox: 0, oy: 0 });
      state.sel = k; buildControls(); render();
      setStatus(`${PANEL_NAMES[k]}에 그림을 넣었어요. 끌거나 두 손가락으로 맞춰 보세요.`);
    };
    img.onerror = () => setStatus("그림을 열지 못했어요. 다른 파일로 해 보세요.");
    img.src = URL.createObjectURL(file);
  }
  fileInput.addEventListener("change", () => { const f = fileInput.files[0]; if (f) loadFile(fileInput.dataset.target, f); fileInput.value = ""; });
  const dz = document.getElementById("dropzone");
  dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("over"); });
  dz.addEventListener("dragleave", () => dz.classList.remove("over"));
  dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("over"); if (isPanel(state.sel)) loadFile(state.sel, e.dataTransfer.files[0]); });

  // ---------- 전체 배치: 누르면 고르기 ----------
  function prevMm(e) { const r = preview.getBoundingClientRect(), V = L.view; return { x: V.x + (e.clientX - r.left) / r.width * V.w, y: V.y + (e.clientY - r.top) / r.height * V.h }; }
  const inR = (m, r) => m.x >= r.x && m.x <= r.x + r.w && m.y >= r.y && m.y <= r.y + r.h;
  function hit(m) {
    if (Math.hypot(m.x - L.cd.cx, m.y - L.cd.cy) <= L.cd.r + 1) return "cd";
    for (const k of ["inside", "front", "back"]) if (inR(m, L.panels[k].rect)) return k;
    for (const [k, st] of Object.entries(L.strips)) if (inR(m, st.rect)) return "spines:" + k;
    return null;
  }
  let pdrag = null;
  preview.addEventListener("pointerdown", e => {
    const h = hit(prevMm(e)); if (!h) return;
    if (h.startsWith("spines:")) { state.spineSel = h.slice(7); select("spines"); return; }
    if (state.sel !== h) select(h);
    if (e.pointerType === "mouse" && state.img[h]) { pdrag = { k: h, last: prevMm(e) }; preview.setPointerCapture(e.pointerId); }
  });
  preview.addEventListener("pointermove", e => { if (!pdrag) return; const m = prevMm(e); panBy(pdrag.k, m.x - pdrag.last.x, m.y - pdrag.last.y); pdrag.last = m; render(); });
  preview.addEventListener("pointerup", () => { pdrag = null; });
  preview.addEventListener("pointercancel", () => { pdrag = null; });

  // ---------- 편집 창: 끌기 · 두 손가락 확대 · 휠 · 키보드 (글자를 잡으면 글자) ----------
  const pts = new Map(); let gest = null, grabText = null;
  function stageMm(cx, cy) { const r = stage.getBoundingClientRect(), R = stageRegion; return { x: R.x + (cx - r.left) / r.width * R.w, y: R.y + (cy - r.top) / r.height * R.h }; }
  function gestureState() {
    const a = [...pts.values()];
    if (a.length === 1) return { mid: stageMm(a[0].x, a[0].y), dist: 0 };
    const mx = (a[0].x + a[1].x) / 2, my = (a[0].y + a[1].y) / 2;
    return { mid: stageMm(mx, my), dist: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) };
  }
  stage.addEventListener("pointerdown", e => {
    const k = state.sel, m = stageMm(e.clientX, e.clientY);
    if (k === "size") return;
    if (k === "spines") {
      for (const [sk, st] of Object.entries(L.strips)) if (m.x >= st.rect.x && m.x <= st.rect.x + st.rect.w) { state.spineSel = sk; markStrip(); renderStage(); }
      return;
    }
    if (pts.size === 0) {
      const tb = [...textBoxes].reverse().find(b => b.panel === k && inR(m, b));
      grabText = tb ? state.texts.find(t => t.id === tb.id) : null;
      if (grabText && state.textSel !== grabText.id) { state.textSel = grabText.id; buildControls(); }
      if (!grabText && !state.img[k]) return;
    }
    stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    gest = gestureState(); stage.classList.add("dragging");
  });
  stage.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const k = state.sel, now = gestureState();
    if (gest && now && pts.size === (gest.dist ? 2 : 1)) {
      const dx = now.mid.x - gest.mid.x, dy = now.mid.y - gest.mid.y;
      if (grabText) {
        const c = cutOf(k);
        grabText.x = Math.max(0, Math.min(1, grabText.x + dx / c.w));
        grabText.y = Math.max(0, Math.min(1, grabText.y + dy / c.h));
        if (now.dist && gest.dist) { grabText.size = Math.max(1.5, Math.min(30, Math.round(grabText.size * now.dist / gest.dist * 10) / 10)); const sv = document.getElementById("t-size-" + grabText.id); if (sv) sv.value = grabText.size; }
      } else {
        if (now.dist && gest.dist) zoomBy(k, now.dist / gest.dist);
        panBy(k, dx, dy);
      }
      renderPreview(); renderStage();
    }
    gest = now;
  });
  const lift = e => { pts.delete(e.pointerId); gest = pts.size ? gestureState() : null; if (!pts.size) { stage.classList.remove("dragging"); if (grabText) { grabText = null; buildControls(); render(); } } };
  stage.addEventListener("pointerup", lift); stage.addEventListener("pointercancel", lift);
  stage.addEventListener("wheel", e => { const k = state.sel; if (!isPanel(k) || !state.img[k]) return; e.preventDefault(); zoomBy(k, Math.exp(-e.deltaY * 0.0015)); renderPreview(); renderStage(); }, { passive: false });
  stage.addEventListener("keydown", e => {
    const k = state.sel; if (!isPanel(k)) return;
    const step = e.shiftKey ? 2 : 0.5, map = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    const t = state.texts.find(x => x.id === state.textSel && x.panel === k);
    if (map[e.key]) {
      e.preventDefault(); const [dx, dy] = map[e.key];
      if (t) { const c = cutOf(k); t.x = Math.max(0, Math.min(1, t.x + dx / c.w)); t.y = Math.max(0, Math.min(1, t.y + dy / c.h)); }
      else if (state.img[k]) panBy(k, dx, dy);
      render();
    } else if ((e.key === "+" || e.key === "=") && state.img[k]) { zoomBy(k, 1.1); render(); }
    else if (e.key === "-" && state.img[k]) { zoomBy(k, 1 / 1.1); render(); }
    else if (e.key === "Escape") { state.textSel = null; buildControls(); render(); }
  });
  window.addEventListener("resize", () => renderStage());

  // ---------- PDF ----------
  document.getElementById("labels").addEventListener("change", e => { state.labels = e.target.checked; render(); });
  const inClaude = !!(window.claude && window.claude.use);
  let downloads = null; const saveBtn = document.getElementById("savePdf");
  if (inClaude) (async () => {
    try { downloads = await window.claude.use("downloads"); } catch (_) { downloads = null; }
    if (!downloads) { saveBtn.disabled = true; setStatus("이 화면에서는 파일 받기를 쓸 수 없어요."); }
  })();
  async function makePdfBlob() {
    const s = 12, cv = document.createElement("canvas"); cv.width = A4.w * s; cv.height = A4.h * s;
    drawSheet(cv.getContext("2d"), s, false);
    const { jsPDF } = window.jspdf, doc = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
    doc.setProperties({ title: "미니 CD 케이스 인쇄용 (A4 실제 크기)" });
    doc.addImage(cv.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, A4.w, A4.h);
    return doc.output("blob");
  }
  function browserSave(blob, name) {
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  saveBtn.addEventListener("click", async () => {
    if (inClaude && !downloads) return;
    if (!window.jspdf) { setStatus("PDF 도구를 불러오지 못했어요. 페이지를 새로 열어 주세요."); return; }
    const left = ["front", "inside", "back", "cd"].filter(k => !state.mine[k]).map(k => PANEL_NAMES[k]);
    saveBtn.disabled = true; setStatus("PDF를 만드는 중이에요…");
    try {
      await Promise.all(state.texts.map(ensureFont));
      const blob = await makePdfBlob(), name = "CD케이스_A4_실제크기.pdf";
      if (downloads) await downloads.save({ filename: name, data: blob }); else browserSave(blob, name);
      setStatus("PDF를 저장했어요. 인쇄할 때 배율 100%로 맞춰 주세요." + (left.length ? ` (예시 그림 그대로인 칸: ${left.join(", ")})` : ""));
    } catch (err) {
      const code = err && err.code;
      setStatus(code === "declined" ? "저장을 취소했어요." : code === "rate_limited" ? "저장 창이 이미 열려 있어요. 잠시 뒤 다시 눌러 주세요." : "PDF를 저장하지 못했어요. 다시 눌러 주세요.");
    } finally { saveBtn.disabled = inClaude && !downloads; }
  });

  async function start() {
    relayout();
    try { await Promise.all(['700 20px "IBM Plex Sans KR"', '400 20px "IBM Plex Sans KR"', '700 20px "Space Grotesk"'].map(f => document.fonts.load(f))); } catch (_) {}
    await loadSamples(); buildControls(); render();
    if (state.sampleName) setStatus("지금은 리센느 PULSE 예시 그림이 들어 있어요. 칸마다 내 그림으로 바꿔 넣으면 돼요.");
  }
  start();
})();
</script>

</body>
