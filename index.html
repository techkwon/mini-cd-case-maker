<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="그림을 올려 칸에 맞추고 뒷면 접는 부분에 색과 글자를 넣어 A4 실제 크기 PDF로 받는 미니 CD 케이스 인쇄 도구">
<title>미니 CD 케이스 공방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: 위 = 전체 배치(칸 고르기), 아래·오른쪽 = 고른 칸을 크게 띄운 편집 창 + 조작 버튼. 좁으면 한 줄로 쌓음 */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #16191f;
  --muted: #5d6573;
  --line: #d9dee6;
  --accent: #1f4fd8;
  --accent-ink: #ffffff;
  --accent-soft: #e5ecfd;
  --ok: #157a4a;
  --sheet: #ffffff;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
  --radius: 12px;
  --tap: 46px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #1a1d24; --ink: #eceff4; --muted: #9aa3b2; --line: #2c313b;
    --accent: #7c9dff; --accent-ink: #0d1530; --accent-soft: #1e2740; --ok: #5fd39a; --sheet: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #1a1d24; --ink: #eceff4; --muted: #9aa3b2; --line: #2c313b;
  --accent: #7c9dff; --accent-ink: #0d1530; --accent-soft: #1e2740; --ok: #5fd39a; --sheet: #ffffff; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }
header { display: grid; gap: 10px; }
h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 0.85rem; color: var(--muted); }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.steps b { font-family: var(--font-num); color: var(--accent); margin-right: 4px; }
.main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 1rem; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card h2 span { font-family: var(--font-num); font-size: 0.82rem; font-weight: 500; color: var(--muted); }
#preview { width: 100%; height: auto; display: block; background: var(--sheet); border-radius: 8px; box-shadow: 0 0 0 1px var(--line); cursor: pointer; touch-action: manipulation; }
#stage { width: 100%; height: auto; display: block; background: #e9ecf1; border-radius: 10px; touch-action: none; cursor: grab; box-shadow: 0 0 0 1px var(--line); }
#stage.dragging { cursor: grabbing; }
#stage:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 520px) { .tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tabs button {
  font: inherit; font-size: 0.88rem; min-height: var(--tap); border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); border-radius: 10px; cursor: pointer; padding: 4px 6px; display: grid; place-items: center; line-height: 1.2;
}
.tabs button small { font-size: 0.72rem; color: var(--muted); }
.tabs button.done small { color: var(--ok); font-weight: 700; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tabs button[aria-selected="true"] small { color: var(--accent-ink); }
.bigbtn { font: inherit; font-weight: 700; font-size: 1rem; min-height: 52px; width: 100%; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.btn {
  font: inherit; font-size: 0.9rem; min-height: var(--tap); border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); padding: 6px 10px; border-radius: 10px; cursor: pointer; display: inline-grid; place-items: center; line-height: 1.2;
}
.btn .ic { font-family: var(--font-num); font-size: 1.25rem; font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.btn:active { background: var(--accent-soft); }
.btn:disabled, .bigbtn:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 0.84rem; color: var(--muted); margin: 0; }
.gesture { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.84rem; color: var(--muted); margin: 0; padding: 0; list-style: none; }
.gesture li::before { content: "·"; margin-right: 6px; color: var(--accent); font-weight: 700; }
.strip { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
.strip.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.strip h3 { margin: 0; font-size: 0.92rem; display: flex; justify-content: space-between; gap: 8px; }
.strip h3 span { font-family: var(--font-num); font-weight: 500; color: var(--muted); font-size: 0.8rem; }
.strip-row { display: grid; grid-template-columns: auto auto auto auto minmax(0, 1fr); gap: 8px; align-items: center; }
input[type="text"] { font: inherit; font-size: 16px; width: 100%; min-height: var(--tap); padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
input[type="color"] { width: var(--tap); height: var(--tap); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 3px; cursor: pointer; }
select { font: inherit; font-size: 15px; min-height: var(--tap); padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.export { display: grid; gap: 10px; }
.status { font-size: 0.88rem; min-height: 1.3em; margin: 0; }
.check { display: flex; gap: 10px; align-items: center; font-size: 0.9rem; min-height: var(--tap); cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.dropzone.over #stage { box-shadow: 0 0 0 3px var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>미니 CD 케이스 공방</h1>
    <ol class="steps">
      <li><b>1</b>칸 고르기</li><li><b>2</b>그림 넣기</li><li><b>3</b>손가락으로 맞추기</li><li><b>4</b>A4 PDF 받기</li>
    </ol>
  </header>

  <div class="main">
    <section class="card" aria-label="전체 배치">
      <h2>전체 배치 <span>A4 · 실제 크기 mm</span></h2>
      <canvas id="preview" width="1400" height="980" aria-label="CD 케이스 전체 배치. 칸을 누르면 그 칸을 편집해요"></canvas>
      <p class="hint">칸을 누르면 오른쪽(휴대폰은 아래) 편집 창에 크게 떠요. 실선은 자르는 선, 칸 위아래의 짧은 점선은 접는 자리예요.</p>
    </section>

    <section class="card" aria-label="칸 편집">
      <div class="tabs" role="tablist" id="tabs"></div>
      <h2 id="stageTitle">앞면 <span>40×40mm</span></h2>
      <div class="dropzone" id="dropzone">
        <canvas id="stage" width="800" height="800" tabindex="0" aria-label="고른 칸 편집 창. 끌어서 옮기고 두 손가락으로 확대해요. 키보드 화살표로도 옮길 수 있어요"></canvas>
      </div>
      <div id="controls" class="export"></div>
    </section>

    <section class="card export" aria-label="PDF 받기" style="grid-column: 1 / -1">
      <label class="check"><input type="checkbox" id="labels" checked> 칸 이름과 안내 글자도 함께 인쇄</label>
      <button class="bigbtn" id="savePdf">A4 PDF 받기</button>
      <p class="status" id="status" role="status"></p>
      <p class="hint">인쇄할 때 배율을 100%(실제 크기)로 맞춰야 크기가 정확해요. 그림은 자르는 선 밖으로 1mm 더 그려져서 가위질이 조금 빗나가도 흰 틈이 안 생겨요.</p>
    </section>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>

<script>
(() => {
  // ---------- 치수(mm) ----------
  const A4 = { w: 210, h: 297 };
  const BLEED = 1;
  const COVER = { x: 20, y: 25, w: 80, h: 40 };
  const BACK = { x: 120, y: 25, w: 55, h: 40 };
  const CD = { cx: 39.5, cy: 104.5, r: 19.5, hole: 2.5 };
  const VIEW = { x: 10, y: 14, w: 175, h: 122.5 };

  const PANELS = {
    front:  { name: "앞면", size: "40×40mm", rect: { x: 60, y: 25, w: 40, h: 40 }, bleed: [0, 1, 1, 1] },
    inside: { name: "안쪽 면", size: "40×40mm", rect: { x: 20, y: 25, w: 40, h: 40 }, bleed: [1, 0, 1, 1] },
    back:   { name: "뒷면", size: "40×40mm", rect: { x: 130, y: 25, w: 40, h: 40 }, bleed: [0, 0, 1, 1] },
    cd:     { name: "CD", size: "Ø39mm · 구멍 Ø5mm", circle: true }
  };
  // 뒷면 접는 부분: 왼쪽은 5mm씩 두 번 접히고 오른쪽은 한 번
  const STRIPS = {
    foldL1: { name: "왼쪽 접힘 ①", range: "바깥 0~5mm", x: 120, w: 5, bleed: [1, 0, 1, 1] },
    foldL2: { name: "왼쪽 접힘 ②", range: "5~10mm", x: 125, w: 5, bleed: [0, 0, 1, 1] },
    foldR:  { name: "오른쪽 접힘", range: "50~55mm", x: 170, w: 5, bleed: [0, 1, 1, 1] }
  };
  const FOLDS_BACK = [125, 130, 170];
  const FOLD_COVER = 60;
  const ZMIN = 1, ZMAX = 4;

  const state = {
    sel: "front", spineSel: "foldL2", labels: true,
    img: { front: null, inside: null, back: null, cd: null },
    mine: { front: false, inside: false, back: false, cd: false },
    fit: { front: { z: 1, ox: 0, oy: 0 }, inside: { z: 1, ox: 0, oy: 0 }, back: { z: 1, ox: 0, oy: 0 }, cd: { z: 1, ox: 0, oy: 0 } },
    strips: {
      foldL1: { bg: "#1b1f2a", text: "SAMPLE · 예시 앨범", fg: "#ffffff", dir: "down" },
      foldL2: { bg: "#1b1f2a", text: "SAMPLE · 예시 앨범", fg: "#ffffff", dir: "down" },
      foldR:  { bg: "#e9e4da", text: "SAMPLE · 예시 앨범", fg: "#1b1f2a", dir: "down" }
    },
    spinesTouched: false
  };

  // ---------- 예시 그림 ----------
  function sampleArt(w, h, c1, c2, title, sub) {
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const g = cv.getContext("2d");
    const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.globalAlpha = 0.16; g.strokeStyle = "#fff"; g.lineWidth = w * 0.006;
    for (let i = -h; i < w; i += w * 0.06) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + h, h); g.stroke(); }
    g.globalAlpha = 1; g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = `700 ${Math.round(Math.min(w, h) * 0.13)}px "Space Grotesk", sans-serif`;
    g.fillText(title, w / 2, h / 2 - h * 0.05);
    g.font = `500 ${Math.round(Math.min(w, h) * 0.06)}px "IBM Plex Sans KR", sans-serif`;
    g.fillText(sub, w / 2, h / 2 + h * 0.1);
    return cv;
  }
  function loadImg(src) {
    return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  }
  async function loadSamples() {
    // 예시: 리센느 미니 4집 PULSE (같이 올린 sample/ 그림). 못 불러오면 그려 낸 예시 그림
    const fallback = {
      front: () => sampleArt(900, 900, "#1f4fd8", "#0d1a3f", "SAMPLE", "예시 그림 · 앞면"),
      inside: () => sampleArt(900, 900, "#c2410c", "#3b1206", "INSIDE", "예시 그림 · 안쪽 면"),
      back: () => sampleArt(900, 900, "#0f766e", "#062b28", "BACK", "예시 그림 · 뒷면"),
      cd: () => sampleArt(900, 900, "#6d28d9", "#1d0b3d", "CD", "예시 그림 · CD")
    };
    const keys = ["front", "inside", "back", "cd"];
    // 리센느 예시 그림은 claude.ai 비공개 페이지에만 같이 올림 (공개 깃허브 페이지에는 없음)
    const got = (window.claude && window.claude.use) ? await Promise.all(keys.map(k => loadImg("sample/" + k + ".jpg"))) : keys.map(() => null);
    keys.forEach((k, i) => { state.img[k] = got[i] || fallback[k](); });
    if (got.every(Boolean)) {
      state.sampleName = "리센느 PULSE 예시";
      Object.assign(state.strips.foldL1, { bg: "#3a3f47", text: "RESCENE · PULSE", fg: "#ffffff" });
      Object.assign(state.strips.foldL2, { bg: "#3a3f47", text: "RESCENE · PULSE", fg: "#ffffff" });
      Object.assign(state.strips.foldR, { bg: "#eef0f3", text: "RESCENE · 4th Mini Album", fg: "#3a3f47" });
    }
  }

  // ---------- 기하 ----------
  const grow = (r, b) => ({ x: r.x - b[0], y: r.y - b[2], w: r.w + b[0] + b[1], h: r.h + b[2] + b[3] });
  function boxOf(k) {
    if (k === "cd") { const rr = CD.r + BLEED / 2; return { x: CD.cx - rr, y: CD.cy - rr, w: rr * 2, h: rr * 2 }; }
    return grow(PANELS[k].rect, PANELS[k].bleed);
  }
  function cutOf(k) {
    if (k === "cd") return { x: CD.cx - CD.r, y: CD.cy - CD.r, w: CD.r * 2, h: CD.r * 2 };
    if (k === "spines") return { x: BACK.x, y: BACK.y, w: BACK.w, h: BACK.h };
    return PANELS[k].rect;
  }
  function regionOf(k) {
    const c = cutOf(k), pad = k === "spines" ? 4 : 3.5;
    return { x: c.x - pad, y: c.y - pad, w: c.w + pad * 2, h: c.h + pad * 2 };
  }

  // ---------- 그리기 ----------
  function coverDraw(g, img, box, fit, s) {
    const iw = img.width, ih = img.height, bw = box.w * s, bh = box.h * s;
    const sc = Math.max(bw / iw, bh / ih) * fit.z, dw = iw * sc, dh = ih * sc;
    const x = box.x * s + bw / 2 - dw / 2 + fit.ox * Math.max(0, (dw - bw) / 2);
    const y = box.y * s + bh / 2 - dh / 2 + fit.oy * Math.max(0, (dh - bh) / 2);
    g.save(); g.beginPath(); g.rect(box.x * s, box.y * s, bw, bh); g.clip(); g.drawImage(img, x, y, dw, dh); g.restore();
  }
  function drawStrip(g, key, s) {
    const st = STRIPS[key], v = state.strips[key];
    const r = grow({ x: st.x, y: BACK.y, w: st.w, h: BACK.h }, st.bleed);
    g.fillStyle = v.bg; g.fillRect(r.x * s, r.y * s, r.w * s, r.h * s);
    const text = (v.text || "").trim();
    if (!text) return;
    g.save(); g.translate((st.x + st.w / 2) * s, (BACK.y + BACK.h / 2) * s);
    g.rotate(v.dir === "down" ? Math.PI / 2 : -Math.PI / 2);
    let size = st.w * 0.55 * s; g.font = `700 ${size}px "IBM Plex Sans KR", sans-serif`;
    const maxLen = (BACK.h - 3) * s, tw = g.measureText(text).width;
    if (tw > maxLen) { size *= maxLen / tw; g.font = `700 ${size}px "IBM Plex Sans KR", sans-serif`; }
    g.fillStyle = v.fg; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, 0, size * 0.04);
    g.restore();
  }
  function drawSheet(g, s) {
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, A4.w * s, A4.h * s);
    for (const k of ["inside", "front", "back"]) if (state.img[k]) coverDraw(g, state.img[k], boxOf(k), state.fit[k], s);
    for (const k of Object.keys(STRIPS)) drawStrip(g, k, s);
    if (state.img.cd) {
      const rr = CD.r + BLEED / 2;
      g.save(); g.beginPath(); g.arc(CD.cx * s, CD.cy * s, rr * s, 0, Math.PI * 2); g.clip();
      coverDraw(g, state.img.cd, boxOf("cd"), state.fit.cd, s); g.restore();
    }
    g.fillStyle = "#ffffff"; g.beginPath(); g.arc(CD.cx * s, CD.cy * s, CD.hole * s, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "#8c8c8c"; g.lineWidth = Math.max(1, 0.1 * s); g.setLineDash([]);
    g.strokeRect(COVER.x * s, COVER.y * s, COVER.w * s, COVER.h * s);
    g.strokeRect(BACK.x * s, BACK.y * s, BACK.w * s, BACK.h * s);
    g.beginPath(); g.arc(CD.cx * s, CD.cy * s, CD.r * s, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.arc(CD.cx * s, CD.cy * s, CD.hole * s, 0, Math.PI * 2); g.stroke();
    g.setLineDash([1 * s, 1 * s]);
    const tick = (x, top, bot) => {
      g.beginPath(); g.moveTo(x * s, (top - 1.5) * s); g.lineTo(x * s, (top - 5) * s); g.stroke();
      g.beginPath(); g.moveTo(x * s, (bot + 1.5) * s); g.lineTo(x * s, (bot + 5) * s); g.stroke();
    };
    tick(FOLD_COVER, COVER.y, COVER.y + COVER.h);
    FOLDS_BACK.forEach(x => tick(x, BACK.y, BACK.y + BACK.h));
    g.setLineDash([]);
    if (state.labels) {
      g.fillStyle = "#8c8c8c"; g.textAlign = "center"; g.textBaseline = "alphabetic";
      g.font = `400 ${2.3 * s}px "IBM Plex Sans KR", sans-serif`;
      g.fillText("앞커버 80×40mm (왼쪽 = 안쪽 면, 오른쪽 = 앞면)", (COVER.x + COVER.w / 2) * s, (COVER.y + COVER.h + 9) * s);
      g.fillText("뒷면 55×40mm (왼쪽 5mm씩 두 번, 오른쪽 5mm 접음)", (BACK.x + BACK.w / 2) * s, (BACK.y + BACK.h + 9) * s);
      g.fillText("CD Ø39mm · 구멍 Ø5mm", CD.cx * s, (CD.cy + CD.r + 5) * s);
      g.font = `400 ${2.6 * s}px "IBM Plex Sans KR", sans-serif`;
      g.fillText("실선 = 자르는 선 · 칸 위아래 점선 = 접는 자리 · 배율 100%(실제 크기)로 인쇄", A4.w / 2 * s, 285 * s);
    }
  }

  // 편집 표시(인쇄 안 됨): 고른 칸 바깥을 흐리게, 칸 이름
  function focusPath(g, k, s, pad) {
    if (k === "cd") { g.arc(CD.cx * s, CD.cy * s, (CD.r + pad) * s, 0, Math.PI * 2); return; }
    const c = cutOf(k); g.rect((c.x - pad) * s, (c.y - pad) * s, (c.w + pad * 2) * s, (c.h + pad * 2) * s);
  }
  function overlay(g, s, k, area, strong) {
    g.save();
    g.beginPath(); g.rect(area.x * s, area.y * s, area.w * s, area.h * s); focusPath(g, k, s, 0);
    g.fillStyle = strong ? "rgba(233,236,241,0.78)" : "rgba(255,255,255,0.55)"; g.fill("evenodd");
    g.beginPath(); focusPath(g, k, s, strong ? 0 : 1.2);
    g.strokeStyle = "#1f4fd8"; g.lineWidth = Math.max(2, (strong ? 0.25 : 0.35) * s); g.setLineDash(strong ? [] : [1.2 * s, 0.8 * s]); g.stroke();
    g.restore();
  }
  function panelLabels(g, s) {
    g.save(); g.font = `700 ${3 * s}px "IBM Plex Sans KR", sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
    const tag = (txt, x, y) => {
      const w = g.measureText(txt).width + 2.4 * s, h = 4.6 * s;
      g.fillStyle = "rgba(22,25,31,0.72)"; g.beginPath(); g.roundRect(x * s - w / 2, y * s - h / 2, w, h, 1.2 * s); g.fill();
      g.fillStyle = "#fff"; g.fillText(txt, x * s, y * s + 0.1 * s);
    };
    for (const k of ["inside", "front", "back"]) { const r = PANELS[k].rect; tag((state.mine[k] ? "" : "+ ") + PANELS[k].name, r.x + r.w / 2, r.y + r.h - 5); }
    tag((state.mine.cd ? "" : "+ ") + "CD", CD.cx, CD.cy + 9);
    tag("접힘", 127.5, BACK.y + 5);
    g.restore();
  }

  const preview = document.getElementById("preview"), pctx = preview.getContext("2d");
  const stage = document.getElementById("stage"), sctx = stage.getContext("2d");
  let stageRegion = regionOf("front");

  function renderPreview() {
    const s = preview.width / VIEW.w; preview.height = Math.round(VIEW.h * s);
    pctx.setTransform(1, 0, 0, 1, 0, 0); pctx.translate(-VIEW.x * s, -VIEW.y * s);
    drawSheet(pctx, s);
    overlay(pctx, s, state.sel, { x: 0, y: 0, w: A4.w, h: A4.h }, false);
    panelLabels(pctx, s);
  }
  function renderStage() {
    const k = state.sel; stageRegion = regionOf(k);
    const cssW = stage.clientWidth || 600, dpr = Math.min(2, window.devicePixelRatio || 1);
    const maxH = Math.max(220, Math.min(window.innerHeight * 0.55, 560));
    let w = cssW, h = w * stageRegion.h / stageRegion.w;
    if (h > maxH) { h = maxH; w = h * stageRegion.w / stageRegion.h; }
    stage.style.width = w + "px"; stage.style.marginInline = "auto";
    stage.width = Math.round(w * dpr); stage.height = Math.round(h * dpr);
    const s = stage.width / stageRegion.w;
    sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.translate(-stageRegion.x * s, -stageRegion.y * s);
    drawSheet(sctx, s);
    overlay(sctx, s, k, stageRegion, true);
    if (k === "spines") {
      const st = STRIPS[state.spineSel];
      sctx.strokeStyle = "#1f4fd8"; sctx.lineWidth = Math.max(2, 0.35 * s); sctx.setLineDash([0.8 * s, 0.6 * s]);
      sctx.strokeRect((st.x + 0.2) * s, (BACK.y + 0.2) * s, (st.w - 0.4) * s, (BACK.h - 0.4) * s); sctx.setLineDash([]);
    }
  }
  function render() { renderPreview(); renderStage(); renderTabs(); }

  // ---------- 탭·조작 ----------
  const TABS = [["front", "앞면"], ["inside", "안쪽 면"], ["back", "뒷면"], ["spines", "접는 부분"], ["cd", "CD"]];
  const tabsEl = document.getElementById("tabs"), controls = document.getElementById("controls");
  const titleEl = document.getElementById("stageTitle"), fileInput = document.getElementById("file");

  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
    }
    kids.flat().forEach(k => e.append(k)); return e;
  }
  function doneOf(k) { return k === "spines" ? state.spinesTouched : state.mine[k]; }
  function renderTabs() {
    tabsEl.replaceChildren(...TABS.map(([k, n]) => el("button", {
      role: "tab", id: "tab-" + k, "aria-selected": String(state.sel === k), class: doneOf(k) ? "done" : "",
      onclick: () => select(k)
    }, n, el("small", {}, doneOf(k) ? "✓ 완료" : (k === "spines" ? "색·글자" : (state.sampleName ? "리센느 예시" : "예시 그림"))))));
  }
  function select(k) { state.sel = k; buildControls(); render(); }

  function pickColor(img) {
    const c = document.createElement("canvas"); c.width = c.height = 24;
    const g = c.getContext("2d"); g.drawImage(img, 0, 0, 24, 24);
    const d = g.getImageData(0, 0, 24, 24).data; let r = 0, gg = 0, b = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; n++; }
    r = Math.round(r / n); gg = Math.round(gg / n); b = Math.round(b / n);
    const lum = (0.299 * r + 0.587 * gg + 0.114 * b) / 255;
    return { bg: "#" + [r, gg, b].map(v => v.toString(16).padStart(2, "0")).join(""), fg: lum > 0.6 ? "#1b1f2a" : "#ffffff" };
  }

  function zoomBy(k, factor) { const f = state.fit[k]; f.z = Math.max(ZMIN, Math.min(ZMAX, f.z * factor)); clampPan(k); }
  function clampPan(k) { const f = state.fit[k]; f.ox = Math.max(-1, Math.min(1, f.ox)); f.oy = Math.max(-1, Math.min(1, f.oy)); }
  function panBy(k, dxMm, dyMm) {
    const img = state.img[k], f = state.fit[k], box = boxOf(k);
    const sc = Math.max(box.w / img.width, box.h / img.height) * f.z;
    const exX = (img.width * sc - box.w) / 2, exY = (img.height * sc - box.h) / 2;
    if (exX > 0.001) f.ox += dxMm / exX;
    if (exY > 0.001) f.oy += dyMm / exY;
    clampPan(k);
  }

  function buildControls() {
    const k = state.sel;
    if (k === "spines") { titleEl.replaceChildren("뒷면 접는 부분 ", el("span", {}, "왼쪽 5mm×2 · 오른쪽 5mm")); controls.replaceChildren(...spineControls()); return; }
    const p = PANELS[k];
    titleEl.replaceChildren(p.name + " ", el("span", {}, p.size));
    const mine = state.mine[k];
    controls.replaceChildren(
      el("button", { class: "bigbtn", id: "pick-" + k, onclick: () => { fileInput.dataset.target = k; fileInput.click(); } },
        mine ? "다른 그림으로 바꾸기" : "이 칸에 그림 넣기"),
      el("ul", { class: "gesture" },
        el("li", {}, "한 손가락으로 끌어 옮기기"), el("li", {}, "두 손가락으로 벌려 확대"), el("li", {}, "그림 파일을 창에 끌어다 놓기")),
      el("div", { class: "tools" },
        el("button", { class: "btn", "aria-label": "축소", onclick: () => { zoomBy(k, 1 / 1.15); render(); } }, el("span", { class: "ic" }, "−"), "작게"),
        el("button", { class: "btn", "aria-label": "확대", onclick: () => { zoomBy(k, 1.15); render(); } }, el("span", { class: "ic" }, "+"), "크게"),
        el("button", { class: "btn", onclick: () => { Object.assign(state.fit[k], { z: 1, ox: 0, oy: 0 }); render(); } }, el("span", { class: "ic" }, "⟲"), "처음대로"),
        el("button", { class: "btn", onclick: () => { const f = state.fit[k]; f.ox = 0; f.oy = 0; render(); } }, el("span", { class: "ic" }, "◎"), "가운데")),
      ...(k === "cd" ? [el("p", { class: "hint" }, "가운데 Ø5mm 구멍 자리는 항상 흰색으로 비워 둬요.")] : []),
      ...(k === "front" ? [el("button", { class: "btn", onclick: () => { applyFrontColor(); setStatus("앞면 그림 색으로 접는 부분을 칠했어요."); } }, "앞면 그림 색으로 접는 부분 칠하기")] : [])
    );
  }

  function applyFrontColor() {
    if (!state.img.front) return;
    const c = pickColor(state.img.front);
    for (const s of Object.values(state.strips)) { s.bg = c.bg; s.fg = c.fg; }
    state.spinesTouched = true; render();
  }

  function spineControls() {
    const out = [el("p", { class: "hint" }, "케이스에 끼우면 옆에서 보이는 자리예요. 편집 창에서 칸을 눌러 고르고 색과 글자를 넣어요.")];
    for (const [k, st] of Object.entries(STRIPS)) {
      const v = state.strips[k];
      const sel = () => { if (state.spineSel !== k) { state.spineSel = k; markStrip(); renderStage(); } };
      const touched = () => { state.spinesTouched = true; render(); };
      const t = el("input", { type: "text", id: "txt-" + k, value: v.text, placeholder: "예: 가수 이름 · 앨범 이름",
        onfocus: sel, oninput: e => { v.text = e.target.value; touched(); } });
      const bg = el("input", { type: "color", id: "bg-" + k, value: v.bg, "aria-label": st.name + " 배경색", onfocus: sel, oninput: e => { v.bg = e.target.value; touched(); } });
      const fg = el("input", { type: "color", id: "fg-" + k, value: v.fg, "aria-label": st.name + " 글자색", onfocus: sel, oninput: e => { v.fg = e.target.value; touched(); } });
      const dir = el("select", { id: "dir-" + k, "aria-label": st.name + " 글자 방향", onfocus: sel, onchange: e => { v.dir = e.target.value; touched(); } },
        el("option", { value: "down" }, "위→아래"), el("option", { value: "up" }, "아래→위"));
      dir.value = v.dir;
      out.push(el("div", { class: "strip" + (state.spineSel === k ? " on" : ""), "data-strip": k, onclick: sel },
        el("h3", {}, st.name, el("span", {}, st.range)),
        t,
        el("div", { class: "strip-row" }, el("span", { class: "hint" }, "배경"), bg, el("span", { class: "hint" }, "글자"), fg, dir)));
    }
    out.push(el("div", { class: "row2" },
      el("button", { class: "btn", onclick: () => {
        const src = state.strips[state.spineSel];
        for (const s of Object.values(state.strips)) { s.bg = src.bg; s.fg = src.fg; }
        state.spinesTouched = true; buildControls(); render();
      } }, "고른 칸 색을 모두에"),
      el("button", { class: "btn", onclick: () => { applyFrontColor(); buildControls(); render(); } }, "앞면 그림 색으로")));
    return out;
  }
  function markStrip() { controls.querySelectorAll(".strip").forEach(n => n.classList.toggle("on", n.dataset.strip === state.spineSel)); }

  // ---------- 파일 ----------
  function loadFile(k, file) {
    if (!file || !file.type.startsWith("image/")) { setStatus("그림 파일(jpg, png 등)만 넣을 수 있어요."); return; }
    const img = new Image();
    img.onload = () => {
      state.img[k] = img; state.mine[k] = true; Object.assign(state.fit[k], { z: 1, ox: 0, oy: 0 });
      state.sel = k; buildControls(); render();
      setStatus(`${PANELS[k].name}에 그림을 넣었어요. 끌거나 두 손가락으로 맞춰 보세요.`);
    };
    img.onerror = () => setStatus("그림을 열지 못했어요. 다른 파일로 해 보세요.");
    img.src = URL.createObjectURL(file);
  }
  fileInput.addEventListener("change", () => { const f = fileInput.files[0]; if (f) loadFile(fileInput.dataset.target, f); fileInput.value = ""; });
  const dz = document.getElementById("dropzone");
  dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("over"); });
  dz.addEventListener("dragleave", () => dz.classList.remove("over"));
  dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("over"); if (PANELS[state.sel]) loadFile(state.sel, e.dataTransfer.files[0]); });

  // ---------- 전체 배치: 누르면 고르기 (마우스는 끌어서 옮기기도) ----------
  function prevMm(e) { const r = preview.getBoundingClientRect(); return { x: VIEW.x + (e.clientX - r.left) / r.width * VIEW.w, y: VIEW.y + (e.clientY - r.top) / r.height * VIEW.h }; }
  function hit(m) {
    const inR = r => m.x >= r.x && m.x <= r.x + r.w && m.y >= r.y && m.y <= r.y + r.h;
    if (Math.hypot(m.x - CD.cx, m.y - CD.cy) <= CD.r + 1) return "cd";
    for (const k of ["inside", "front", "back"]) if (inR(PANELS[k].rect)) return k;
    for (const [k, st] of Object.entries(STRIPS)) if (inR({ x: st.x, y: BACK.y, w: st.w, h: BACK.h })) return "spines:" + k;
    return null;
  }
  let pdrag = null;
  preview.addEventListener("pointerdown", e => {
    const h = hit(prevMm(e)); if (!h) return;
    if (h.startsWith("spines:")) { state.spineSel = h.slice(7); select("spines"); return; }
    if (state.sel !== h) select(h);
    if (e.pointerType === "mouse" && state.img[h]) { pdrag = { k: h, last: prevMm(e) }; preview.setPointerCapture(e.pointerId); }
  });
  preview.addEventListener("pointermove", e => { if (!pdrag) return; const m = prevMm(e); panBy(pdrag.k, m.x - pdrag.last.x, m.y - pdrag.last.y); pdrag.last = m; render(); });
  preview.addEventListener("pointerup", () => { pdrag = null; });
  preview.addEventListener("pointercancel", () => { pdrag = null; });

  // ---------- 편집 창: 끌기 · 두 손가락 확대 · 휠 · 키보드 ----------
  const pts = new Map(); let gest = null;
  function stageMm(cx, cy) { const r = stage.getBoundingClientRect(); return { x: stageRegion.x + (cx - r.left) / r.width * stageRegion.w, y: stageRegion.y + (cy - r.top) / r.height * stageRegion.h }; }
  function gestureState() {
    const a = [...pts.values()];
    if (a.length === 1) return { mid: stageMm(a[0].x, a[0].y), dist: 0 };
    const mx = (a[0].x + a[1].x) / 2, my = (a[0].y + a[1].y) / 2;
    return { mid: stageMm(mx, my), dist: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) };
  }
  stage.addEventListener("pointerdown", e => {
    const k = state.sel;
    if (k === "spines") {
      const m = stageMm(e.clientX, e.clientY);
      for (const [sk, st] of Object.entries(STRIPS)) if (m.x >= st.x && m.x <= st.x + st.w) { state.spineSel = sk; markStrip(); renderStage(); const inp = document.getElementById("txt-" + sk); if (inp && e.pointerType === "mouse") inp.focus(); }
      return;
    }
    if (!state.img[k]) return;
    stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    gest = gestureState(); stage.classList.add("dragging");
  });
  stage.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const k = state.sel, now = gestureState();
    if (gest && now && pts.size === (gest.dist ? 2 : 1)) {
      if (now.dist && gest.dist) zoomBy(k, now.dist / gest.dist);
      panBy(k, now.mid.x - gest.mid.x, now.mid.y - gest.mid.y);
      renderPreview(); renderStage();
    }
    gest = now;
  });
  const lift = e => { pts.delete(e.pointerId); gest = pts.size ? gestureState() : null; if (!pts.size) stage.classList.remove("dragging"); };
  stage.addEventListener("pointerup", lift); stage.addEventListener("pointercancel", lift);
  stage.addEventListener("wheel", e => { const k = state.sel; if (!PANELS[k] || !state.img[k]) return; e.preventDefault(); zoomBy(k, Math.exp(-e.deltaY * 0.0015)); renderPreview(); renderStage(); }, { passive: false });
  stage.addEventListener("keydown", e => {
    const k = state.sel; if (!PANELS[k] || !state.img[k]) return;
    const step = e.shiftKey ? 2 : 0.5, map = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    if (map[e.key]) { e.preventDefault(); panBy(k, ...map[e.key]); render(); }
    else if (e.key === "+" || e.key === "=") { zoomBy(k, 1.1); render(); }
    else if (e.key === "-") { zoomBy(k, 1 / 1.1); render(); }
  });
  window.addEventListener("resize", () => renderStage());

  // ---------- PDF ----------
  const statusEl = document.getElementById("status");
  function setStatus(t) { statusEl.textContent = t; }
  document.getElementById("labels").addEventListener("change", e => { state.labels = e.target.checked; render(); });
  // claude.ai 안에서는 downloads 기능으로, 그 밖(깃허브 페이지 등)에서는 브라우저 내려받기로 저장
  const inClaude = !!(window.claude && window.claude.use);
  let downloads = null; const saveBtn = document.getElementById("savePdf");
  if (inClaude) (async () => {
    try { downloads = await window.claude.use("downloads"); } catch (_) { downloads = null; }
    if (!downloads) { saveBtn.disabled = true; setStatus("이 화면에서는 파일 받기를 쓸 수 없어요."); }
  })();
  async function makePdfBlob() {
    const s = 12, cv = document.createElement("canvas"); cv.width = A4.w * s; cv.height = A4.h * s;
    drawSheet(cv.getContext("2d"), s);
    const { jsPDF } = window.jspdf, doc = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
    doc.setProperties({ title: "미니 CD 케이스 인쇄용 (A4 실제 크기)" });
    doc.addImage(cv.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, A4.w, A4.h);
    return doc.output("blob");
  }
  function browserSave(blob, name) {
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  saveBtn.addEventListener("click", async () => {
    if (inClaude && !downloads) return;
    if (!window.jspdf) { setStatus("PDF 도구를 불러오지 못했어요. 페이지를 새로 열어 주세요."); return; }
    const left = ["front", "inside", "back", "cd"].filter(k => !state.mine[k]).map(k => PANELS[k].name);
    saveBtn.disabled = true; setStatus("PDF를 만드는 중이에요…");
    try {
      const blob = await makePdfBlob(), name = "CD케이스_A4_실제크기.pdf";
      if (downloads) await downloads.save({ filename: name, data: blob }); else browserSave(blob, name);
      setStatus("PDF를 저장했어요. 인쇄할 때 배율 100%로 맞춰 주세요." + (left.length ? ` (예시 그림 그대로인 칸: ${left.join(", ")})` : ""));
    } catch (err) {
      const code = err && err.code;
      setStatus(code === "declined" ? "저장을 취소했어요." : code === "rate_limited" ? "저장 창이 이미 열려 있어요. 잠시 뒤 다시 눌러 주세요." : "PDF를 저장하지 못했어요. 다시 눌러 주세요.");
    } finally { saveBtn.disabled = inClaude && !downloads; }
  });

  async function start() {
    try { await Promise.all(['700 20px "IBM Plex Sans KR"', '400 20px "IBM Plex Sans KR"', '700 20px "Space Grotesk"'].map(f => document.fonts.load(f))); } catch (_) {}
    await loadSamples(); buildControls(); render();
    if (state.sampleName) setStatus("지금은 리센느 PULSE 예시 그림이 들어 있어요. 칸마다 내 그림으로 바꿔 넣으면 돼요.");
  }
  start();
})();
</script>

</body>
</html>
